name: Feature request
description: Propose a new command, setting, or behavior.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that the router does not let you do now?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should the router do it? Give an example command or setting if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other solutions that you tried
